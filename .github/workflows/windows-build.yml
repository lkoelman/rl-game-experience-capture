name: Windows Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_DIR: builddir
  GSTREAMER_VERSION: 1.28.2
  GSTREAMER_ROOT: C:\gstreamer\1.0\msvc_x86_64
  GSTREAMER_RELEASE_BASE_URL: https://github.com/lkoelman/rl-game-experience-capture/releases/download/v0.1.0-devel

jobs:
  build:
    name: Build Windows x64 Release
    runs-on: windows-2022
    defaults:
      run:
        working-directory: trajectory-recorder-cpp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install conan meson ninja

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Detect Conan profile
        shell: pwsh
        run: conan profile detect --force

      - name: Install GStreamer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $assetName = "gstreamer-1.0-msvc-x86_64-$env:GSTREAMER_VERSION.exe"
          $installer = Join-Path $env:RUNNER_TEMP $assetName
          $checksumFile = Join-Path $env:RUNNER_TEMP "$assetName.sha256sum"

          Invoke-WebRequest `
            -Uri "$env:GSTREAMER_RELEASE_BASE_URL/$assetName" `
            -OutFile $installer
          Invoke-WebRequest `
            -Uri "$env:GSTREAMER_RELEASE_BASE_URL/$assetName.sha256sum" `
            -OutFile $checksumFile

          $checksumLine = (Get-Content -Path $checksumFile -Raw).Trim()
          if ($checksumLine -notmatch '^([A-Fa-f0-9]{64})\s+\*?(.+)$') {
            throw "Unexpected GStreamer checksum file format: $checksumLine"
          }
          $expectedHash = $Matches[1].ToUpperInvariant()
          $actualHash = (Get-FileHash -Path $installer -Algorithm SHA256).Hash.ToUpperInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "GStreamer installer checksum mismatch. Expected $expectedHash but got $actualHash"
          }

          $installRoot = "C:\gstreamer"
          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/DIR=$installRoot") `
            -Wait `
            -PassThru
          if ($process.ExitCode -notin @(0, 3010)) {
            throw "GStreamer installer failed with exit code $($process.ExitCode): $installer"
          }

          if (-not (Test-Path $env:GSTREAMER_ROOT)) {
            throw "GStreamer root not found after install: $env:GSTREAMER_ROOT"
          }

      - name: Build and test
        shell: pwsh
        run: ./scripts/build.ps1 -BuildDir $env:BUILD_DIR -BuildType release -GStreamerRoot $env:GSTREAMER_ROOT

      - name: Stage app executables
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $artifactDir = "artifacts/windows-x64-release"
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null

          foreach ($exe in @(
            "record_session.exe",
            "validate_recording.exe",
            "map_actions.exe",
            "virtual_gamepad_bridge.exe"
          )) {
            Copy-Item -Path (Join-Path $env:BUILD_DIR $exe) -Destination $artifactDir
          }

      - name: Upload app executables
        uses: actions/upload-artifact@v4
        with:
          name: trajectory-recorder-windows-x64-release
          path: trajectory-recorder-cpp/artifacts/windows-x64-release/
