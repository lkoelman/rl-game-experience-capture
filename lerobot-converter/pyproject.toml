[project]
name = "game2lerobot"
version = "0.1.0"
description = "Convert video game trajectories to LeRobotDataset format"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "decord>=0.6.0",
    "lerobot>=0.5.0",
]

[project.scripts]
game2lerobot = "game2lerobot.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
